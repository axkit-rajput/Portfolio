<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        } else {
          document.querySelector('meta[name="color-scheme"]').content = 'dark';
        }
      } catch (e) {}
    </script>
    <title>Ankit Mewada | AI Engineer & Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Ankit Mewada, featuring multi-agent AI systems, explainable machine learning, full-stack development and backend engineering projects."
    />
    <meta name="author" content="Ankit Mewada" />
    <meta name="keywords" content="Ankit Mewada, AI Engineer, Full-Stack Developer, NIT Rourkela, AnkAI, LangGraph, Machine Learning, SHAP, React, Python" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ankit Mewada | AI Engineer & Full-Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Ankit Mewada, featuring multi-agent AI systems, explainable machine learning, full-stack development and backend engineering projects."
    />
    <meta property="og:image" content="./profile.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ankit Mewada | AI Engineer & Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ankit Mewada, featuring multi-agent AI systems, explainable machine learning, full-stack development and backend engineering projects."
    />
    <meta name="twitter:image" content="./profile.jpg" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
